name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test:coverage
      - run: pnpm contract-check

  image:
    # The container builds, answers its health check and serves the web app (in-memory storage).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t b-calendar .
      - name: Health check and web app
        run: |
          docker run -d --name app -p 3000:3000 \
            -e STORAGE=memory \
            -e ADMIN_PASSWORD="$(openssl rand -base64 24)" \
            -e SESSION_SECRET="$(openssl rand -base64 48)" b-calendar
          for i in $(seq 1 30); do curl -sf localhost:3000/health && break; sleep 1; done
          curl -sf localhost:3000/health
          curl -sf localhost:3000/c/anything | grep -q '<div id="root">' || { docker logs app; exit 1; }
          curl -sf localhost:3000/sw.js | grep -q showNotification
