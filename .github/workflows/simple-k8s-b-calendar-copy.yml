name: simple-k8s build (b-calendar-copy)
on:
  push:
    branches: [ main ]
  # "Fix" on a security finding and "Rebuild & deploy" build again on a fresh
  # base image (lib/imagefix.ts, lib/autorebuild.ts); fresh: no layer cache either.
  workflow_dispatch:
    inputs:
      fresh:
        description: "Build without the layer cache (newest OS packages)"
        type: boolean
        default: false
      # A rebuild builds the commit that runs, not the branch's newest.
      ref:
        description: "Commit to build (a rebuild of the running version)"
        type: string
        required: false
# A rebuild's run is named for its commit (lib/autorebuildparse.ts rebuildRef);
# every other run keeps GitHub's own name (an empty run-name).
run-name: "${{ inputs.ref && format('simple-k8s rebuild {0}', inputs.ref) || '' }}"
permissions:
  contents: read
  packages: write
# One build of this app at a time per branch, in push order (a newer push
# waiting replaces an older one still waiting), so builds finish in order.
concurrency:
  group: simple-k8s-b-calendar-copy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          # Always fetch the newest base image (its security fixes), never a stale one.
          pull: true
          # A rebuild for the newest packages: every layer again, none from the cache.
          no-cache: ${{ inputs.fresh == true }}
          push: true
          # :latest only from main: a preview built from another branch never moves it,
          # nor a rebuild of an older commit (inputs.ref).
          tags: |
            ghcr.io/vaarvik/b-calendar/b-calendar-copy:${{ inputs.ref || github.sha }}
            ${{ github.ref_name == 'main' && !inputs.ref && 'ghcr.io/vaarvik/b-calendar/b-calendar-copy:latest' || '' }}
